name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      VERSION: 1.0.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Unit tests (core logic and safety rules)
        run: dotnet test tests/Declutter.Core.Tests -c Release --logger "console;verbosity=normal"

      - name: Integration tests (real Windows APIs)
        run: dotnet test tests/Declutter.Windows.Tests -c Release --logger "console;verbosity=normal"

      # The steps below still run when a test fails (for full feedback); the job fails either way
      # and nothing is released.
      - name: Publish single-file executables
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/Declutter.App -c Release -r $rid --self-contained `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true -p:DebugType=none `
              -p:Version=$env:VERSION -o "artifacts/$rid"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item artifacts/win-x64/Declutter.exe release/Declutter.exe
          Copy-Item artifacts/win-arm64/Declutter.exe release/Declutter-ARM64.exe

      - name: Smoke test (launch the real app in light and dark mode, open every page, check text contrast)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $failed = $false
          foreach ($theme in 'light', 'dark') {
            $out = Join-Path $PWD "artifacts/smoke/$theme"
            Write-Host "=== $theme theme ==="
            $p = Start-Process -FilePath 'release/Declutter.exe' -ArgumentList '--smoke-test', "`"$out`"", '--theme', $theme -PassThru
            $null = $p.Handle  # keeps ExitCode available after exit
            if (-not $p.WaitForExit(600000)) { $p.Kill(); Write-Error "Smoke test ($theme) timed out"; exit 1 }
            if (Test-Path "$out/smoke-test.log") { Get-Content "$out/smoke-test.log" } else { Write-Warning 'No smoke-test log was written' }
            Write-Host "Exit code ($theme): $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/smoke/
          if-no-files-found: ignore

      - name: Upload executables
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Declutter-${{ env.VERSION }}
          path: release/

      # Published with GitHub's own CLI: upload to a hidden draft first, publish only once both files are
      # in, retry on GitHub hiccups. A half-made release is never visible (or offered to the updater).
      - name: Publish release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $notes = @'
          **Download `Declutter.exe`** (most laptops), or `Declutter-ARM64.exe` for Snapdragon / ARM laptops.

          It's a single file with nothing to install. Double-click it and allow the administrator prompt.
          Windows may show "Windows protected your PC" because the app isn't code-signed: click **More info → Run anyway**.

          Already using Declutter? It offers this update itself (bottom of the sidebar).

          See the [README](https://github.com/REPO#readme) for what each tool does and how it keeps your files safe.
          '@
          Set-Content -Path release-notes.md -Value $notes.Replace('REPO', $env:GH_REPO) -Encoding utf8

          $tag = "v$env:VERSION"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release view $tag *> $null
            if ($LASTEXITCODE -ne 0) {
              gh release create $tag --draft --target $env:GITHUB_SHA --title "Declutter $env:VERSION" --notes-file release-notes.md
            }
            gh release upload $tag release/Declutter.exe release/Declutter-ARM64.exe --clobber
            if ($LASTEXITCODE -eq 0) {
              gh release edit $tag --draft=false --latest
              if ($LASTEXITCODE -eq 0) { Write-Host "Published $tag"; exit 0 }
            }
            Write-Warning "Attempt $attempt failed; retrying"
            Start-Sleep -Seconds (20 * $attempt)
          }
          Write-Error "Couldn't publish $tag"
          exit 1
